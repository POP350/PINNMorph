extends: base.yaml
pde: heat_2d_multiscale
method: single_trajectory_eoh_policy_population
algorithm_overrides:
  optimization:
    phases:
    - optimizer: adam
      iterations: 14000
      parameters:
        learning_rate: 0.001
      scheduler:
        name: none
        parameters: {}
    - optimizer: lbfgs
      iterations: 6000
      parameters:
        learning_rate: 1.0
        history_size: 100
        line_search_fn: strong_wolfe
      scheduler:
        name: none
        parameters: {}
