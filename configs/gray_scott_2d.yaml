extends: base.yaml
pde: gray_scott_2d
method: single_trajectory_eoh_policy_population
algorithm_overrides:
  optimization:
    # Stiff two-component reaction-diffusion: keep most budget in Adam to
    # traverse transients, then use a conservative L-BFGS polish.
    phases:
      - optimizer: adam
        iterations: 14000
        parameters: {learning_rate: 0.001}
        scheduler: {name: none, parameters: {}}
      - optimizer: lbfgs
        iterations: 6000
        parameters: {learning_rate: 1.0, history_size: 100, line_search_fn: strong_wolfe}
        scheduler: {name: none, parameters: {}}
  loss:
    terms:
      - {name: pde_residual, loss_function: mse, weight: 1.0, parameters: {}}
      - {name: initial_condition, loss_function: mse, weight: 10.0, parameters: {}}
