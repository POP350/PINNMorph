extends: base.yaml
pde: kuramoto_sivashinsky_1d
method: single_trajectory_eoh_policy_population
algorithm_overrides:
  constraint_enforcement:
    method: problem_hard
    transform_id: ks_initial_exact
    parameters: {}
  optimization:
    phases:
    - optimizer: adam
      iterations: 14000
      parameters:
        learning_rate: 0.001
      scheduler:
        name: none
        parameters: {}
    - optimizer: lbfgs
      iterations: 6000
      parameters:
        learning_rate: 1.0
        history_size: 100
        line_search_fn: strong_wolfe
      scheduler:
        name: none
        parameters: {}
  loss:
    terms:
    - name: pde_residual
      loss_function: mse
      weight: 1.0
      parameters: {}
    - name: initial_condition
      loss_function: mse
      weight: 10.0
      parameters: {}
